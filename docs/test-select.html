<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <title>TOEFL Test Selection</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <img src="logo.png"
             alt="Crimson Education brand logo centered above a dashboard heading"
             style="width:90%; height:auto; display:block; margin:0 auto;" />
    </header>

    <h1 class="h1">Crimson Education<br>
        TOEFL Student Center</h1>

    <a href="index.html" class="button-link button-back">Go back to main page</a>

    <p class="expText">Please select a mock test.</p>

    <div class="test-box" id="testBox">
        <p class="expText" id="loadingMsg">Loading available tests…</p>
    </div>

    <p class="expText">Please select a mock<br>
        test to begin your TOEFL practice.</p>

    <script>
        var ENGINE_URL = 'https://script.google.com/macros/s/AKfycbx9eTiq48XWGmvwmCS2Js3T_GJ3oh_Yaz40dQzY19Rxs27uNMAGUaN3EOB_EOx4N9VavQ/exec';

        var testBox = document.getElementById('testBox');

        function renderTests(tests) {
            testBox.innerHTML = '';

            if (!tests.length) {
                testBox.innerHTML = '<p class="expText">No tests are available right now.</p>';
                return;
            }

            tests.forEach(function (t) {
                var a = document.createElement('a');
                a.className = 'button-link';
                a.href = ENGINE_URL + '?test=' + encodeURIComponent(t.sheetId);
                a.textContent = t.name;
                testBox.appendChild(a);
            });
        }

        function showError() {
            testBox.innerHTML =
                '<p class="expText">Couldn\'t load the test list. ' +
                'Please refresh, or contact your tutor if this keeps happening.</p>';
        }

        fetch(ENGINE_URL + '?action=list')
            .then(function (res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
            })
            .then(function (data) {
                if (!data.ok) throw new Error(data.error || 'Registry error');
                renderTests(data.tests || []);
            })
            .catch(function (err) {
                console.error('Test list fetch failed:', err);
                showError();
            });
    </script>
</body>

</html>
